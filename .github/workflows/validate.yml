name: Validate PWA prototype

on:
  push:
    branches:
      - feature/pwa-install-prototype
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Use Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Use Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.0'
      - name: Install Android SDK
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Check browser script syntax
        run: |
          node --check android-native-bridge.js
          node --check install.js
          node --check ios-guidance-v2.js
          node --check service-worker.js
      - name: Run repository validation
        run: node --test tests/*.mjs
      - name: Build and lint managed Android package
        shell: bash
        run: |
          set -euo pipefail
          LOG_FILE="$(mktemp)"
          if gradle -p android testDebugUnitTest lintDebug assembleDebug 2>&1 | tee "$LOG_FILE"; then
            exit 0
          fi

          if ! grep -Eqi '429|Too Many Requests|repo\.maven\.apache\.org.*429' "$LOG_FILE"; then
            exit 1
          fi

          echo "Maven Central rate limited dependency resolution; retrying once with the same Android gate."
          sleep 10
          gradle -p android testDebugUnitTest lintDebug assembleDebug
