<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4a0d7f">
  <script>
    (() => {
      const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      if (standalone) {
        window.location.replace('https://myhrfh.com');
      }
    })();
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="myHRFH">
  <title>Add the HRFH web app | HR for Health</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <script src="./install.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <section class="install-card" aria-labelledby="page-title">
      <header class="brand-lockup" aria-label="HR for Health">
        <span class="brand-mark-shell" aria-hidden="true">
          <img class="brand-icon" src="./icons/icon-192.png" alt="">
        </span>
        <span class="brand-name"><strong>HR</strong> for Health</span>
      </header>

      <div class="hero-copy">
        <p class="eyebrow">HRFH web app</p>
        <h1 id="page-title">Add the HRFH web app</h1>
        <p id="intro-copy" class="intro">Your HR for Health portal, one tap from your home screen.</p>
      </div>

      <div id="platform-content" class="platform-content" aria-live="polite">
        <p>Preparing the best setup for your device…</p>
      </div>

      <div class="actions">
        <button id="install-button" class="button button-primary" type="button" hidden>
          Install HRFH web app
        </button>
        <a id="open-button" class="button button-secondary" href="https://myhrfh.com" rel="noopener">
          Open myHRFH
        </a>
      </div>

      <p id="status-message" class="status" role="status" aria-live="polite"></p>

      <footer class="trust-note">
        <span class="trust-dot" aria-hidden="true"></span>
        Opens <strong>myhrfh.com</strong>
      </footer>
    </section>
  </main>
</body>
</html>
