<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4a0d7f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="myHRFH">
  <title>Add myHRFH to your phone | HR for Health</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <script src="./install.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <section class="install-card" aria-labelledby="page-title">
      <header class="brand-lockup" aria-label="HR for Health">
        <img class="brand-icon" src="./icons/icon-192.png" alt="">
        <span class="brand-name"><strong>HR</strong> for Health</span>
      </header>

      <div class="hero-copy">
        <p class="eyebrow">myHRFH mobile access</p>
        <h1 id="page-title">Add myHRFH to your phone</h1>
        <p class="intro">Get one-tap access to your HR for Health portal. No app store, no download, and no long setup.</p>
      </div>

      <div id="platform-content" class="platform-content" aria-live="polite">
        <p>Checking the best setup for your device…</p>
      </div>

      <div class="actions">
        <button id="install-button" class="button button-primary" type="button" hidden>
          Add to Home Screen
        </button>
        <a id="open-button" class="button button-secondary" href="https://myhrfh.com" rel="noopener">
          Open myHRFH now
        </a>
      </div>

      <p id="status-message" class="status" role="status" aria-live="polite"></p>

      <footer class="trust-note">
        <span class="trust-dot" aria-hidden="true"></span>
        Shortcut opens <strong>myhrfh.com</strong>
      </footer>
    </section>
  </main>
</body>
</html>
