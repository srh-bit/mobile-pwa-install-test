<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4a0d7f">
  <title>Opening myHRFH</title>
  <script>
    (() => {
      const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      if (standalone) {
        try {
          window.localStorage.setItem('myhrfh-install-receipt-v1', 'installed');
        } catch {
          // Storage may be restricted; launch should still continue.
        }
      }
      window.location.replace('https://myhrfh.com');
    })();
  </script>
  <meta http-equiv="refresh" content="0;url=https://myhrfh.com">
  <style>
    html, body { margin: 0; min-height: 100%; background: #ffffff; }
  </style>
</head>
<body></body>
</html>
